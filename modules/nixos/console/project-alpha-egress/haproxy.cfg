# SNI relay for the console CI guest. A connection is accepted only after the
# guest presents a listed TLS server name, HAProxy resolves that name with its
# own IPv4 resolver, rejects every denied address, and then dials the resolved
# address on 443. TLS stays end to end; no key, CA or proxy variable exists in
# the guest.
#
# `default-path config` makes every `-f` name below resolve beside this file in
# the Nix store, so the list HAProxy reads is byte-for-byte the list the NixOS
# module renders into the relay unit's IPAddressDeny=.

global
    default-path config
    dns-accept-family ipv4
    maxconn 256
    nbthread 2
    httpclient.resolvers.disabled on
    log stderr format raw daemon

resolvers upstream
    nameserver upstream1 1.1.1.1:53
    nameserver upstream2 9.9.9.9:53
    accepted_payload_size 1232
    resolve_retries 1
    timeout resolve 1s
    timeout retry 1s

frontend guest
    mode tcp
    bind fd@3
    log global
    log-format "egress entry=%[var(txn.entry)] state=%ts"
    tcp-request inspect-delay 10s
    acl sni_chars req.ssl_sni,lower -m reg '\A[a-z0-9.-]{1,253}\z'
    acl sni_listed req.ssl_sni,lower -m str -f allow-exact.list
    acl sni_actions req.ssl_sni,lower -m reg '\A[a-z0-9-]+\.actions\.githubusercontent\.com\z'
    # A fixed label for anything rejected from here on. A7 allows only the
    # matched entry or fixed text in the journal, never a guest-supplied name.
    tcp-request content set-var(txn.entry) str(rejected-sni)
    tcp-request content reject unless { req.ssl_hello_type 1 }
    # sni_chars must stay before the list match. HAProxy's string match looks
    # the sample up as a C string (pattern.c, ebst_lookup), so an embedded NUL
    # truncates it: `github.com\0.evil.example` would equal `github.com` while
    # the resolver would still see the full name. PCRE2 matches by length, and
    # this class rejects every NUL.
    tcp-request content reject unless sni_chars
    tcp-request content reject unless sni_listed || sni_actions
    tcp-request content set-var(txn.entry) str(rejected-resolve)
    tcp-request content do-resolve(txn.dst,upstream,ipv4) req.ssl_sni,lower
    tcp-request content reject unless { var(txn.dst) -m found }
    tcp-request content reject unless { var(txn.dst) -m ip 0.0.0.0/1 128.0.0.0/1 }
    tcp-request content set-var(txn.entry) str(rejected-address)
    tcp-request content reject if { var(txn.dst) -m ip -f deny-ipv4.list }
    tcp-request content set-dst var(txn.dst)
    tcp-request content set-dst-port int(443)
    tcp-request content set-var(txn.entry) req.ssl_sni,lower if sni_listed
    tcp-request content set-var(txn.entry) str(*.actions.githubusercontent.com) if sni_actions !sni_listed
    tcp-request content accept if sni_listed || sni_actions
    tcp-request content reject
    timeout client 30s
    timeout tunnel 1h
    default_backend upstream_443

backend upstream_443
    mode tcp
    timeout connect 5s
    timeout server 30s
    timeout tunnel 1h
    # set-dst above replaces this address; the port is fixed here so the
    # resolved port is never used.
    server upstream 0.0.0.0:443
