name: CI

on:
  push:
    branches:
      - main
      - ci/**
  pull_request:
  workflow_dispatch:

# Least privilege by default: no job gets a token scope it does not ask for.
permissions: {}

# One in-flight run per ref. Superseded runs on PRs and feature branches are
# cancelled so a 1h+ build is not spent on a commit nobody is waiting for; runs
# on main are never cancelled, so every commit that lands keeps a build record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Most PRs only touch shared or host config, which `validate` already
  # evaluates and format-checks in about two minutes, so the required check
  # `ci-passed` passes on `validate` alone for those. The hour-long `build`
  # matrix only runs on a push to main, a manual dispatch, an edit to
  # `flake.lock`, or a PR explicitly carrying the `full-build` label. A PR
  # that only edits `packages/**` instead builds just the changed packages
  # via the `packages` job — minutes, not the full host matrix. Editing this
  # workflow file no longer triggers either the matrix or a package build, so
  # a skipped `build` and/or `packages` job on an ordinary PR is the expected
  # outcome, not a failure.
  changes:
    name: Determine build need
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      packages: ${{ steps.decide.outputs.packages }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Decide whether the build matrix is needed
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_FULL_BUILD_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-build') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HAS_FULL_BUILD_LABEL" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CHANGED_FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "::error::Could not diff $BASE_SHA...$HEAD_SHA (merge base not found)."
            exit 1
          fi
          echo "changed files:"
          echo "$CHANGED_FILES"

          PACKAGE_NAMES=$(echo "$CHANGED_FILES" | grep -E '^packages/' | sed -E 's#^packages/([^/]+).*#\1#; s/\.nix$//' | sort -u)
          CHANGED_PACKAGES=""
          for name in $PACKAGE_NAMES; do
            if [ -f "packages/$name.nix" ]; then
              CHANGED_PACKAGES="$CHANGED_PACKAGES $name"
            fi
          done
          CHANGED_PACKAGES=$(echo $CHANGED_PACKAGES)
          echo "changed packages:"
          echo "$CHANGED_PACKAGES"
          echo "packages=$CHANGED_PACKAGES" >> "$GITHUB_OUTPUT"

          if echo "$CHANGED_FILES" | grep -Eq '^flake\.lock$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes; do not leave a credential in .git/config.
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@1f095fee853b33114486cfdeae62fa099cda35a9 # v33

      - name: Evaluate flake outputs
        run: nix flake show --no-write-lock-file

      - name: Check installer syntax
        run: bash -n install.sh

      # Scoped to the paths known to be nixpkgs-fmt clean. Widening this to the
      # whole tree needs one `nix fmt` pass over the other .nix files first.
      - name: Check formatting
        run: nix fmt -- --check flake.nix modules/nixos/default.nix modules/nixos/common/myusers.nix modules/nixos/gui modules/home/hyprland.nix modules/home/brave.nix configurations/home/kevin.nix configurations/nixos/desktop configurations/nixos/laptop modules/nixos/console configurations/nixos/console configurations/home/console packages/opengameinstaller.nix

      - name: Evaluate workstation configurations
        run: |
          nix eval .#nixosConfigurations.desktop.config.system.build.toplevel.drvPath
          nix eval .#nixosConfigurations.laptop.config.system.build.toplevel.drvPath
          nix eval .#nixosConfigurations.console.config.system.build.toplevel.drvPath

  build:
    name: Build (${{ matrix.host }})
    needs: [validate, changes]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: [desktop, laptop, console]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@1f095fee853b33114486cfdeae62fa099cda35a9 # v33

      - name: Build ${{ matrix.host }} configuration
        run: nix build --no-link ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

  packages:
    name: Build changed packages
    needs: changes
    if: needs.changes.outputs.packages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@1f095fee853b33114486cfdeae62fa099cda35a9 # v33

      - name: Build changed packages
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          for p in $PACKAGES; do
            nix build --no-link ".#$p"
          done

  # Single stable check name to mark as a required status check on main. The
  # matrix job names change whenever the host list changes; this one does not,
  # so a branch ruleset that requires "CI / ci-passed" keeps working. Without a
  # required check, `gh pr merge --auto` merges immediately (SHOC-46).
  ci-passed:
    name: ci-passed
    if: always()
    needs: [changes, validate, build, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Assert required jobs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_NEEDED: ${{ needs.changes.outputs.build }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
          PACKAGES_NEEDED: ${{ needs.changes.outputs.packages }}
        run: |
          echo "changes=$CHANGES_RESULT validate=$VALIDATE_RESULT build=$BUILD_RESULT build_needed=$BUILD_NEEDED packages=$PACKAGES_RESULT packages_needed=$PACKAGES_NEEDED"

          if [ "$CHANGES_RESULT" != "success" ] || [ "$VALIDATE_RESULT" != "success" ]; then
            echo "::error::CI did not pass (changes or validate did not succeed)."
            exit 1
          fi

          if [ "$BUILD_RESULT" != "success" ]; then
            if [ "$BUILD_RESULT" != "skipped" ] || [ "$BUILD_NEEDED" != "false" ]; then
              echo "::error::CI did not pass (build reported '$BUILD_RESULT' while build_needed='$BUILD_NEEDED')."
              exit 1
            fi
          fi

          if [ "$PACKAGES_RESULT" != "success" ]; then
            if [ "$PACKAGES_RESULT" != "skipped" ] || [ -n "$PACKAGES_NEEDED" ]; then
              echo "::error::CI did not pass (packages reported '$PACKAGES_RESULT' while packages_needed='$PACKAGES_NEEDED')."
              exit 1
            fi
          fi
