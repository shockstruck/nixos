name: CI

on:
  push:
    branches:
      - main
      - ci/**
  pull_request:
  workflow_dispatch:

# Least privilege by default: no job gets a token scope it does not ask for.
permissions: {}

# One in-flight run per ref. Superseded runs on PRs and feature branches are
# cancelled so a 1h+ build is not spent on a commit nobody is waiting for; runs
# on main are never cancelled, so every commit that lands keeps a build record.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Most PRs only touch shared or host config, which `validate` already
  # evaluates and format-checks in about two minutes, so the required check
  # `ci-passed` passes on `validate` alone for those. The hour-long `build`
  # matrix only runs on a push to main, a manual dispatch, an edit to
  # `flake.lock`, or a PR explicitly carrying the `full-build` label. A PR
  # that only edits `packages/**` instead builds just the changed packages
  # via the `packages` job — minutes, not the full host matrix. Editing this
  # workflow file no longer triggers either the matrix or a package build, so
  # a skipped `build` and/or `packages` job on an ordinary PR is the expected
  # outcome, not a failure.
  changes:
    name: Determine build need
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      packages: ${{ steps.decide.outputs.packages }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Decide whether the build matrix is needed
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_FULL_BUILD_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-build') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$HAS_FULL_BUILD_LABEL" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "packages=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CHANGED_FILES=$(git diff --name-only "$BASE_SHA...$HEAD_SHA"); then
            echo "::error::Could not diff $BASE_SHA...$HEAD_SHA (merge base not found)."
            exit 1
          fi
          echo "changed files:"
          echo "$CHANGED_FILES"

          PACKAGE_NAMES=$(echo "$CHANGED_FILES" | grep -E '^packages/' | sed -E 's#^packages/([^/]+).*#\1#; s/\.nix$//' | sort -u)
          CHANGED_PACKAGES=""
          for name in $PACKAGE_NAMES; do
            if [ -f "packages/$name.nix" ]; then
              CHANGED_PACKAGES="$CHANGED_PACKAGES $name"
            fi
          done
          CHANGED_PACKAGES=$(echo $CHANGED_PACKAGES)
          echo "changed packages:"
          echo "$CHANGED_PACKAGES"
          echo "packages=$CHANGED_PACKAGES" >> "$GITHUB_OUTPUT"

          if echo "$CHANGED_FILES" | grep -Eq '^flake\.lock$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # Nothing here pushes; do not leave a credential in .git/config.
          persist-credentials: false

      # CUDA builds (e.g. laptop's ollama-cuda) are not on cache.nixos.org;
      # this community cache serves cudaSupport builds of nixos-unstable. A
      # miss on an unsigned or missing path is ignored by Nix, so this cannot
      # make a build fail that would otherwise pass.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@1f095fee853b33114486cfdeae62fa099cda35a9 # v33
        with:
          nix_conf: |
            extra-substituters = https://cache.nixos-cuda.org
            extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=

      - name: Evaluate flake outputs
        run: nix flake show --no-write-lock-file

      - name: Check installer syntax
        run: bash -n install.sh

      # Scoped to the paths known to be nixpkgs-fmt clean. Widening this to the
      # whole tree needs one `nix fmt` pass over the other .nix files first.
      - name: Check formatting
        run: nix fmt -- --check flake.nix modules/nixos/default.nix modules/nixos/common/myusers.nix modules/nixos/gui modules/home/hyprland.nix modules/home/brave.nix configurations/home/kevin.nix configurations/nixos/desktop configurations/nixos/laptop modules/nixos/console configurations/nixos/console configurations/home/console packages/opengameinstaller.nix

      - name: Evaluate workstation configurations
        run: |
          nix eval .#nixosConfigurations.desktop.config.system.build.toplevel.drvPath
          nix eval .#nixosConfigurations.laptop.config.system.build.toplevel.drvPath
          nix eval .#nixosConfigurations.console.config.system.build.toplevel.drvPath

  build:
    name: Build (${{ matrix.host }})
    needs: [validate, changes]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: [desktop, laptop, console]
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Same as validate.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@1f095fee853b33114486cfdeae62fa099cda35a9 # v33
        with:
          nix_conf: |
            extra-substituters = https://cache.nixos-cuda.org
            extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=

      # Repo-scoped Nix binary cache carried in the GitHub Actions cache
      # (free, CI-only, no external account or secret). `actions/cache`
      # needs no token permission beyond this job's default (`contents:
      # read`) — deleting caches via the REST API is the only operation
      # that needs `actions: write`, and this workflow never does that.
      - name: Restore Nix cache
        id: nix-cache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache
          key: nix-cache-${{ matrix.host }}-${{ hashFiles('flake.lock') }}
          restore-keys: |
            nix-cache-${{ matrix.host }}-

      # Plan against upstream substituters only (the file cache isn't wired
      # in yet), so this list reflects only what cache.nixos.org and the
      # CUDA cache cannot supply. Of those, only the expensive builds are
      # worth caching (ollama, noctalia, stasis, terraform, the nvidia
      # driver); units, config files and prebuilt apps rebuild in seconds
      # and would only drag the whole system closure into the copy below.
      # The licence exclusion keeps code-cursor, lmstudio, discord,
      # 1password-cli and claude-code out regardless.
      - name: Plan what upstream can't supply
        run: |
          nix build --dry-run --no-link ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel" 2>&1 | tee "$RUNNER_TEMP/plan.log"
          { grep -oE '/nix/store/[a-z0-9]{32}-[^ ]+\.drv' "$RUNNER_TEMP/plan.log" || true; } | sort -u > "$RUNNER_TEMP/plan.drvs"
          { xargs -r nix-store -q --outputs < "$RUNNER_TEMP/plan.drvs" || true; } \
            | { grep -E -- '^/nix/store/[a-z0-9]{32}-(ollama|noctalia|stasis|terraform|nvidia)[-.]' || true; } \
            | { grep -vE -- '-(code-cursor|cursor|lmstudio|lm-studio|discord|_1password-cli|1password-cli|claude-code)-' || true; } \
            > "$RUNNER_TEMP/push.list"
          wc -l "$RUNNER_TEMP/plan.drvs" "$RUNNER_TEMP/push.list"

      # `require-sigs false` is needed because paths we built ourselves
      # carry no signature and there is no signing secret; it is confined to
      # this one command on an ephemeral runner whose substituters are
      # cache.nixos.org, cache.nixos-cuda.org and a cache only this repo's
      # main/own-branch runs can write. nix-quick-install-action installs
      # Nix single-user (no nix-daemon), so the runner user is trusted and
      # this command-line --option is honoured.
      - name: Build ${{ matrix.host }} configuration
        run: nix build --no-link --option extra-substituters "file://$RUNNER_TEMP/nix-cache" --option require-sigs false ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

      # Fresh directory per run so this holds exactly this run's set, not a
      # cumulative one. A binary cache refuses a path whose references it
      # does not hold ("cannot add ... because the reference ... is not
      # valid"), so the closures are copied first and then pruned down to
      # the planned paths: only those keep their narinfo and nar. At
      # restore time Nix resolves the pruned references from
      # cache.nixos.org and the CUDA cache as it would anyway. zstd keeps
      # the copy fast; actions/cache compresses the archive again itself.
      - name: Copy new paths to the local cache
        continue-on-error: true
        run: |
          while read -r p; do [ -e "$p" ] && echo "$p"; done < "$RUNNER_TEMP/push.list" > "$RUNNER_TEMP/push.valid" || true
          if [ -s "$RUNNER_TEMP/push.valid" ]; then
            xargs nix copy --to "file://$RUNNER_TEMP/nix-cache-new?compression=zstd" < "$RUNNER_TEMP/push.valid"
            echo "closure narinfos: $(ls "$RUNNER_TEMP"/nix-cache-new/*.narinfo | wc -l)"
            for info in "$RUNNER_TEMP"/nix-cache-new/*.narinfo; do
              path=$(sed -n 's/^StorePath: //p' "$info")
              if ! grep -qxF -- "$path" "$RUNNER_TEMP/push.valid"; then
                nar=$(sed -n 's/^URL: //p' "$info")
                rm -f -- "$info" "$RUNNER_TEMP/nix-cache-new/$nar"
              fi
            done
            echo "kept narinfos: $(ls "$RUNNER_TEMP"/nix-cache-new/*.narinfo | wc -l)"
          fi
          du -sh "$RUNNER_TEMP/nix-cache-new" || true

      # Cache keys are immutable, so a second save of the same key is a
      # no-op, not an overwrite — safe to run unconditionally on match.
      # Only main and full-build-labelled PR runs save, to keep the 10 GiB
      # repo cache budget (LRU-evicted) for the builds worth reusing.
      - name: Save Nix cache
        if: success() && (github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'full-build'))
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/nix-cache-new
          key: nix-cache-${{ matrix.host }}-${{ hashFiles('flake.lock') }}

  packages:
    name: Build changed packages
    needs: changes
    if: needs.changes.outputs.packages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # Same as validate.
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@1f095fee853b33114486cfdeae62fa099cda35a9 # v33
        with:
          nix_conf: |
            extra-substituters = https://cache.nixos-cuda.org
            extra-trusted-public-keys = cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=

      - name: Build changed packages
        env:
          PACKAGES: ${{ needs.changes.outputs.packages }}
        run: |
          for p in $PACKAGES; do
            nix build --no-link ".#$p"
          done

  # Single stable check name to mark as a required status check on main. The
  # matrix job names change whenever the host list changes; this one does not,
  # so a branch ruleset that requires "CI / ci-passed" keeps working. Without a
  # required check, `gh pr merge --auto` merges immediately (SHOC-46).
  ci-passed:
    name: ci-passed
    if: always()
    needs: [changes, validate, build, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Assert required jobs passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_NEEDED: ${{ needs.changes.outputs.build }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
          PACKAGES_NEEDED: ${{ needs.changes.outputs.packages }}
        run: |
          echo "changes=$CHANGES_RESULT validate=$VALIDATE_RESULT build=$BUILD_RESULT build_needed=$BUILD_NEEDED packages=$PACKAGES_RESULT packages_needed=$PACKAGES_NEEDED"

          if [ "$CHANGES_RESULT" != "success" ] || [ "$VALIDATE_RESULT" != "success" ]; then
            echo "::error::CI did not pass (changes or validate did not succeed)."
            exit 1
          fi

          if [ "$BUILD_RESULT" != "success" ]; then
            if [ "$BUILD_RESULT" != "skipped" ] || [ "$BUILD_NEEDED" != "false" ]; then
              echo "::error::CI did not pass (build reported '$BUILD_RESULT' while build_needed='$BUILD_NEEDED')."
              exit 1
            fi
          fi

          if [ "$PACKAGES_RESULT" != "success" ]; then
            if [ "$PACKAGES_RESULT" != "skipped" ] || [ -n "$PACKAGES_NEEDED" ]; then
              echo "::error::CI did not pass (packages reported '$PACKAGES_RESULT' while packages_needed='$PACKAGES_NEEDED')."
              exit 1
            fi
          fi
