name: update-flake-lock

on:
  workflow_dispatch:
    inputs:
      inputs:
        description: "Space-separated flake inputs to update (empty = all)"
        required: false
        default: ""
  schedule:
    # Daily. flake.lock tracks nixos-unstable, and pinned inputs are re-checked
    # against upstream releases on the same pass, so "up to date" is never more
    # than a day stale.
    - cron: '0 6 * * *'

# Least privilege: every write below is performed with the GitHub App
# installation token minted in the first step, never with GITHUB_TOKEN.
permissions: {}

# Never let a manual run race the scheduled one onto the same PR branch.
concurrency:
  group: update-flake-lock
  cancel-in-progress: false

env:
  # Shared with automerge-flake-lock.yaml — both must name the same branch.
  LOCK_BRANCH: update_flake_lock_action
  # Deliberately not LOCK_BRANCH: automerge-flake-lock.yaml merges only a PR
  # that touches flake.nix/flake.lock, so package bumps get their own PR and a
  # human merge rather than turning the lock PR's automerge red.
  PACKAGES_BRANCH: update_packages_action

jobs:
  update-lock:
    name: Update flake inputs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # GITHUB_TOKEN only needs to fetch the source; every write below is done
      # with the App installation token.
      contents: read
      # DeterminateSystems/nix-installer-action reads an OIDC token to enable
      # FlakeHub. Without this it logs "FlakeHub is disabled because the
      # workflow is misconfigured" and runs without the FlakeHub cache.
      # https://docs.determinate.systems/guides/github-actions/#nix-installer-action
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # create-pull-request (used inside update-flake-lock) configures its
          # own push credentials from the token it is given, so no credential
          # needs to be persisted in .git/config.
          persist-credentials: false

      # GitHub deliberately does not run workflows for branches pushed by, or
      # PRs opened by, a GitHub Action using GITHUB_TOKEN. On 2026-08-30 that
      # produced a lock-bump PR whose CI run had zero jobs, which auto-merge
      # then treated as no obstacle — landing an evaluation-breaking
      # home-manager bump on main with no validation anywhere.
      #
      # A GitHub App installation token is not subject to that suppression:
      # PRs and merge commits it creates do trigger ci.yaml. It is also
      # short-lived (1h), scoped to this repository, and revoked when the job
      # ends — unlike the long-lived PAT this previously called for.
      - name: Mint GitHub App token
        id: app-token
        uses: ./.github/actions/app-token # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          # Prefer the secret name shockstruck/k8s-gitops uses, so one working
          # PEM can serve both repos; fall back to the name created here first.
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY || secrets.BOT_APP_SECRET_KEY }}

      # `nix flake update` re-locks each input against the ref written in
      # flake.nix, so an input pinned to a release tag never advances on its
      # own. This rewrites those refs to the newest published release first, so
      # the lock step below picks the new version up in the same PR. Branch
      # pins, SHA pins and unpinned inputs are left alone.
      - name: Bump pinned inputs to their latest release
        id: pins
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./.github/scripts/update-pinned-flake-inputs.sh flake.nix

      - name: Commit pinned input bumps
        if: steps.pins.outputs.bumped != '0'
        env:
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.git-name }}
          GIT_AUTHOR_EMAIL: ${{ steps.app-token.outputs.git-email }}
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.git-name }}
          GIT_COMMITTER_EMAIL: ${{ steps.app-token.outputs.git-email }}
        run: |
          set -euo pipefail
          git add flake.nix
          git commit -m "flake.nix: bump pinned inputs to their latest release"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          token: ${{ steps.app-token.outputs.token }}
          inputs: ${{ inputs.inputs }}
          branch: ${{ env.LOCK_BRANCH }}
          pr-title: "Update flake inputs"
          pr-labels: |
            automated
          git-author-name: ${{ steps.app-token.outputs.git-name }}
          git-author-email: ${{ steps.app-token.outputs.git-email }}
          git-committer-name: ${{ steps.app-token.outputs.git-name }}
          git-committer-email: ${{ steps.app-token.outputs.git-email }}
          # The upstream default body tells readers to close and reopen the PR
          # to get CI to run. That advice does not apply here — the App token
          # already makes ci.yaml run — and following it would be misleading.
          pr-body: |
            Automated flake update opened as a GitHub App, so CI runs against it.

            Two things move here, because no single tool covers both:
            `flake.lock` by
            [update-flake-lock](https://github.com/DeterminateSystems/update-flake-lock),
            and release-tag pins in `flake.nix` by
            `.github/scripts/update-pinned-flake-inputs.sh`. Hand-pinned
            packages under `packages/` are bumped on a separate PR.

            ${{ steps.pins.outputs.summary }}

            ### flake.lock

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```

            Merges automatically once `CI / ci-passed` succeeds — see
            `.github/workflows/automerge-flake-lock.yaml`.

  # Kept out of update-lock: automerge-flake-lock.yaml refuses a lock PR that
  # touches anything beyond flake.nix/flake.lock, so a package bump riding on
  # it turned that run red and held the lock update back until someone merged
  # it by hand. On its own branch the lock PR keeps merging itself, and a
  # package bump — a new upstream release, often a prebuilt binary — waits for
  # a person to merge it.
  update-packages:
    name: Update packaged apps
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # FlakeHub OIDC for nix-installer-action, as in update-lock.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # create-pull-request configures its own push credentials from the
          # token it is given.
          persist-credentials: false

      - name: Mint GitHub App token
        id: app-token
        uses: ./.github/actions/app-token # zizmor: ignore[self-repository] actionlint 1.7.12 rejects the $/ form
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY || secrets.BOT_APP_SECRET_KEY }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Packages under packages/ pin their own version and hash by hand, so
      # `nix flake update` can never move them — paperweight sat on 0.5.0 while
      # upstream had shipped 0.6.0. nix-update bumps each one to its newest
      # upstream release and rewrites the hash, addressing them through the
      # `packages.<system>.<name>` attributes nixos-unified already autowires
      # from this directory. A package whose src is a local path has no
      # upstream and is skipped. A package whose release scheme nix-update
      # cannot infer on its own (e.g. a version embedded in a prefixed/suffixed
      # tag) declares extra `nix-update` CLI flags as `passthru.nixUpdateArgs`,
      # which this step reads and forwards.
      #
      # Failure to update one package must not cost the whole refresh, so each
      # is attempted independently and a failed one is reverted and reported.
      - name: Update packaged apps
        id: apps
        run: |
          set -uo pipefail

          summary=""
          bumped=0

          for file in packages/*.nix; do
            attr="$(basename "$file" .nix)"

            if grep -q 'src = \./' "$file"; then
              echo "skip  ${attr}: src is a local path, nothing upstream to track"
              continue
            fi

            # A package may declare extra nix-update arguments (e.g. --version-regex
            # for prefixed/suffixed release tags) as `passthru.nixUpdateArgs`.
            extra=()
            if args_json="$(nix eval --json ".#${attr}.nixUpdateArgs" 2>/dev/null)"; then
              mapfile -t extra < <(jq -r '.[]' <<< "$args_json")
            fi

            before="$(git hash-object "$file")"
            if nix run --inputs-from . nixpkgs#nix-update -- \
              --flake --version=stable "${extra[@]}" "$attr"; then
              after="$(git hash-object "$file")"
              if [ "$before" = "$after" ]; then
                echo "ok    ${attr}: already current"
              else
                version="$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' "$file" | head -n1)"
                echo "bump  ${attr} -> ${version}"
                summary+="- \`${attr}\` → \`${version}\`"$'\n'
                bumped=$((bumped + 1))
              fi
            else
              echo "::warning::nix-update could not update ${attr}; leaving it pinned."
              git checkout -- "$file"
            fi
          done

          echo "bumped ${bumped} packaged app(s)"

          {
            echo "bumped=${bumped}"
            echo "summary<<APPS_EOF"
            if [ "$bumped" -gt 0 ]; then
              echo "### Packaged apps bumped to their latest release"
              echo
              printf '%s' "$summary"
            fi
            echo "APPS_EOF"
          } >> "$GITHUB_OUTPUT"

      # Runs whether or not anything was bumped: with nothing to change the
      # branch matches main, and delete-branch closes a PR that has gone stale.
      # Same create-pull-request pin update-flake-lock@v28 runs for the lock PR.
      - name: Open packaged app PR
        uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.PACKAGES_BRANCH }}
          delete-branch: true
          add-paths: packages
          commit-message: "packages: bump packaged apps to their latest release"
          author: ${{ steps.app-token.outputs.git-name }} <${{ steps.app-token.outputs.git-email }}>
          committer: ${{ steps.app-token.outputs.git-name }} <${{ steps.app-token.outputs.git-email }}>
          title: "Update packaged apps"
          labels: |
            automated
          body: |
            Automated package update opened as a GitHub App, so CI runs against it.

            The hand-pinned packages under `packages/` bumped to their newest
            upstream release by `nix-update`.

            ${{ steps.apps.outputs.summary }}

            Not merged automatically: `automerge-flake-lock.yaml` only merges
            the flake.lock PR. Review the new releases and merge by hand.
