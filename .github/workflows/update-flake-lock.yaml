name: update-flake-lock

on:
  workflow_dispatch:
    inputs:
      inputs:
        description: "Space-separated flake inputs to update (empty = all)"
        required: false
        default: ""
  schedule:
    # Daily. flake.lock tracks nixos-unstable, and pinned inputs are re-checked
    # against upstream releases on the same pass, so "up to date" is never more
    # than a day stale.
    - cron: '0 6 * * *'

# Least privilege: every write below is performed with the GitHub App
# installation token minted in the first step, never with GITHUB_TOKEN.
permissions: {}

# Never let a manual run race the scheduled one onto the same PR branch.
concurrency:
  group: update-flake-lock
  cancel-in-progress: false

env:
  # Shared with automerge-flake-lock.yaml — both must name the same branch.
  LOCK_BRANCH: update_flake_lock_action

jobs:
  update-lock:
    name: Update flake inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # GITHUB_TOKEN only needs to fetch the source; every write below is done
      # with the App installation token.
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # create-pull-request (used inside update-flake-lock) configures its
          # own push credentials from the token it is given, so no credential
          # needs to be persisted in .git/config.
          persist-credentials: false

      # GitHub deliberately does not run workflows for branches pushed by, or
      # PRs opened by, a GitHub Action using GITHUB_TOKEN. On 2026-08-30 that
      # produced a lock-bump PR whose CI run had zero jobs, which auto-merge
      # then treated as no obstacle — landing an evaluation-breaking
      # home-manager bump on main with no validation anywhere (SHOC-46).
      #
      # A GitHub App installation token is not subject to that suppression:
      # PRs and merge commits it creates do trigger ci.yaml. It is also
      # short-lived (1h), scoped to this repository, and revoked when the job
      # ends — unlike the long-lived PAT this previously called for.
      - name: Mint GitHub App token
        id: app-token
        uses: ./.github/actions/app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          # Prefer the secret name shockstruck/k8s-gitops uses, so one working
          # PEM can serve both repos; fall back to the name created here first.
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY || secrets.BOT_APP_SECRET_KEY }}

      # `nix flake update` re-locks each input against the ref written in
      # flake.nix, so an input pinned to a release tag never advances on its
      # own. This rewrites those refs to the newest published release first, so
      # the lock step below picks the new version up in the same PR. Branch
      # pins, SHA pins and unpinned inputs are left alone.
      - name: Bump pinned inputs to their latest release
        id: pins
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: ./.github/scripts/update-pinned-flake-inputs.sh flake.nix

      - name: Commit pinned input bumps
        if: steps.pins.outputs.bumped != '0'
        env:
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.git-name }}
          GIT_AUTHOR_EMAIL: ${{ steps.app-token.outputs.git-email }}
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.git-name }}
          GIT_COMMITTER_EMAIL: ${{ steps.app-token.outputs.git-email }}
        run: |
          set -euo pipefail
          git add flake.nix
          git commit -m "flake.nix: bump pinned inputs to their latest release"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Update flake.lock
        id: update
        uses: DeterminateSystems/update-flake-lock@834c491b2ece4de0bbd00d85214bb5e83b4da5c6 # v28
        with:
          token: ${{ steps.app-token.outputs.token }}
          inputs: ${{ inputs.inputs }}
          branch: ${{ env.LOCK_BRANCH }}
          pr-title: "Update flake inputs"
          pr-labels: |
            automated
          git-author-name: ${{ steps.app-token.outputs.git-name }}
          git-author-email: ${{ steps.app-token.outputs.git-email }}
          git-committer-name: ${{ steps.app-token.outputs.git-name }}
          git-committer-email: ${{ steps.app-token.outputs.git-email }}
          # The upstream default body tells readers to close and reopen the PR
          # to get CI to run. That advice does not apply here — the App token
          # already makes ci.yaml run — and following it would be misleading.
          pr-body: |
            Automated flake update opened as a GitHub App, so CI runs against it.

            `flake.lock` refreshed by
            [update-flake-lock](https://github.com/DeterminateSystems/update-flake-lock);
            release-tag pins in `flake.nix` refreshed by
            `.github/scripts/update-pinned-flake-inputs.sh`.

            ${{ steps.pins.outputs.summary }}

            ### flake.lock

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```

            Merges automatically once `CI / ci-passed` succeeds — see
            `.github/workflows/automerge-flake-lock.yaml`.
