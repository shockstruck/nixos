name: "GitHub App token"
description: "Mint a short-lived GitHub App installation token and resolve the bot's git identity"

inputs:
  app-id:
    description: "GitHub App ID (secrets.BOT_APP_ID)"
    required: true
  private-key:
    description: "GitHub App private key, the .pem file verbatim (secrets.BOT_APP_PRIVATE_KEY)"
    required: true

outputs:
  token:
    description: "Installation access token, valid for one hour and revoked when the job ends"
    value: ${{ steps.token.outputs.token }}
  app-slug:
    description: "Slug of the app the token belongs to"
    value: ${{ steps.token.outputs.app-slug }}
  git-name:
    description: "Commit author/committer name for the app's bot user"
    value: ${{ steps.identity.outputs.name }}
  git-email:
    description: "Commit author/committer email for the app's bot user"
    value: ${{ steps.identity.outputs.email }}

runs:
  using: composite
  steps:
    # The private key must be the PEM file verbatim, real newlines and all. A
    # key whose newlines were flattened on paste, or that was base64-encoded,
    # fails inside the token action with a bare `ERR_OSSL_UNSUPPORTED` from
    # OpenSSL and no hint at the cause — which is how runs 33594528520 and
    # 33595229372 failed. Name the cause instead. Nothing here prints the key:
    # the shape checks report only counts, and openssl runs with -noout and its
    # stderr discarded.
    - name: Check App credentials are well-formed
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail

        restore="Re-store it from the .pem file so the newlines survive:
          gh secret set BOT_APP_PRIVATE_KEY --repo ${GITHUB_REPOSITORY} < your-app.private-key.pem
        (shockstruck/k8s-gitops uses that same secret name with a working key.)"

        fail() { echo "::error::$*"; exit 1; }

        [ -n "$APP_ID" ] || fail "No App ID: BOT_APP_ID is not set for this repository."
        [ -n "$PRIVATE_KEY" ] || fail "No App private key: neither BOT_APP_PRIVATE_KEY nor BOT_APP_SECRET_KEY is set for this repository."

        case "$PRIVATE_KEY" in
          "-----BEGIN "*) ;;
          *) fail "The App private key does not start with '-----BEGIN'. It is not a PEM — a base64-encoded key, or the App's client secret stored by mistake, will look like this. ${restore}" ;;
        esac

        if printf '%s' "$PRIVATE_KEY" | grep -q $'\r'; then
          fail "The App private key has CRLF line endings; the PEM parser needs Unix newlines. ${restore}"
        fi

        lines="$(printf '%s' "$PRIVATE_KEY" | grep -c '' || true)"
        if [ "$lines" -lt 4 ]; then
          fail "The App private key is ${lines} line(s); a PEM is around 28. Its real newlines were lost on the way into the secret — a literal \\n does not work. ${restore}"
        fi

        # Catch-all: whatever the shape checks missed, OpenSSL is the parser
        # that actually has to accept this key.
        if ! printf '%s\n' "$PRIVATE_KEY" | openssl pkey -noout >/dev/null 2>&1; then
          fail "The App private key is ${lines} lines and looks like a PEM, but OpenSSL cannot parse it as a private key. ${restore}"
        fi

        echo "App credentials look well-formed: App ID set, PEM spans ${lines} lines and parses."

    - name: Create installation token
      id: token
      # Same action and same pin shockstruck/k8s-gitops uses, so both repos
      # exchange the App credentials identically. v2's `app-id` input is also
      # what BOT_APP_ID actually holds — v3 deprecates it in favour of
      # `client-id` and warns on every run.
      uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        # Narrow the token to what the two callers need: push the lock branch
        # and merge it (contents), open and merge the PR (pull-requests).
        permission-contents: write
        permission-pull-requests: write

    # Attributes commits to the app's own bot user rather than
    # github-actions[bot], so a commit and the PR carrying it share an author.
    - name: Resolve bot git identity
      id: identity
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        APP_SLUG: ${{ steps.token.outputs.app-slug }}
      run: |
        set -euo pipefail
        user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
        {
          echo "name=${APP_SLUG}[bot]"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
        } >> "$GITHUB_OUTPUT"
