name: "GitHub App token"
description: "Mint a short-lived GitHub App installation token and resolve the bot's git identity"

inputs:
  app-id:
    description: "GitHub App ID (secrets.BOT_APP_ID)"
    required: true
  private-key:
    description: "GitHub App private key, the .pem file verbatim (secrets.BOT_APP_SECRET_KEY)"
    required: true

outputs:
  token:
    description: "Installation access token, valid for one hour and revoked when the job ends"
    value: ${{ steps.token.outputs.token }}
  app-slug:
    description: "Slug of the app the token belongs to"
    value: ${{ steps.token.outputs.app-slug }}
  git-name:
    description: "Commit author/committer name for the app's bot user"
    value: ${{ steps.identity.outputs.name }}
  git-email:
    description: "Commit author/committer email for the app's bot user"
    value: ${{ steps.identity.outputs.email }}

runs:
  using: composite
  steps:
    # The private key must be the PEM file verbatim, real newlines and all. A
    # key pasted as one line, base64-encoded, or with CRLF endings fails inside
    # the token action with a bare `ERR_OSSL_UNSUPPORTED` from OpenSSL and no
    # hint at the cause — which is exactly how run 33594528520 failed. Check
    # the shape first and say what to do about it. Nothing here prints the key.
    - name: Check App credentials are well-formed
      shell: bash
      env:
        APP_ID: ${{ inputs.app-id }}
        PRIVATE_KEY: ${{ inputs.private-key }}
      run: |
        set -euo pipefail

        restore="Re-store it from the .pem file so the newlines survive:
          gh secret set BOT_APP_SECRET_KEY --repo ${GITHUB_REPOSITORY} < your-app.private-key.pem"

        fail() { echo "::error::$*"; exit 1; }

        [ -n "$APP_ID" ] || fail "BOT_APP_ID is not set for this repository."
        [ -n "$PRIVATE_KEY" ] || fail "BOT_APP_SECRET_KEY is not set for this repository."

        case "$PRIVATE_KEY" in
          "-----BEGIN "*) ;;
          *) fail "BOT_APP_SECRET_KEY does not start with '-----BEGIN'. It is not a PEM — a base64-encoded key or a stray quote will do this. ${restore}" ;;
        esac

        if printf '%s' "$PRIVATE_KEY" | grep -q $'\r'; then
          fail "BOT_APP_SECRET_KEY has CRLF line endings; GitHub's PEM parser needs Unix newlines. ${restore}"
        fi

        newlines="$(printf '%s' "$PRIVATE_KEY" | grep -c '' || true)"
        if [ "$newlines" -lt 3 ]; then
          fail "BOT_APP_SECRET_KEY is ${newlines} line(s); a PEM is many. The real newlines were lost — a literal \\n in the secret does not work. ${restore}"
        fi

        echo "App credentials look well-formed: BOT_APP_ID set, PEM spans ${newlines} lines."

    - name: Create installation token
      id: token
      # `app-id` is deprecated upstream in favour of `client-id`; it still works
      # and BOT_APP_ID genuinely holds an App ID. Switch both together if that
      # secret is ever moved to the App's Client ID.
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    # Attributes commits to the app's own bot user rather than
    # github-actions[bot], so a commit and the PR carrying it share an author.
    - name: Resolve bot git identity
      id: identity
      shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        APP_SLUG: ${{ steps.token.outputs.app-slug }}
      run: |
        set -euo pipefail
        user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
        {
          echo "name=${APP_SLUG}[bot]"
          echo "email=${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
        } >> "$GITHUB_OUTPUT"
